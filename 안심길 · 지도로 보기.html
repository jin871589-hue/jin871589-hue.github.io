<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #191f28; background: #f2f4f6; }
  .wrap { display: flex; flex-direction: column; height: 100%; }
  header { padding: 16px 20px 12px; background: #fff; border-bottom: 1px solid #e5e8eb; }
  header .tag { font-size: 15px; font-weight: 700; color: #3182f6; margin: 0 0 2px; }
  header h1 { font-size: 24px; margin: 0; }
  #status { margin: 8px 0 0; font-size: 18px; line-height: 1.45; color: #4e5968; }
  #status.ok { color: #1b64da; }
  #status.err { color: #d22030; }
  .acc { font-size: 15px; color: #8b95a1; margin: 4px 0 0; }
  #map { flex: 1; min-height: 320px; }
  .bar { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #e5e8eb; }
  .btn { flex: 1; min-height: 60px; border: 0; border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer; }
  .btn.pri { background: #3182f6; color: #fff; }
  .btn.sec { background: #e8f3ff; color: #1b64da; }
  .btn:disabled { opacity: .5; }
  /* 내 위치 파란 점 */
  .me-dot { width: 24px; height: 24px; border-radius: 50%; background: #3182f6; border: 4px solid #fff; box-shadow: 0 0 0 8px rgba(49,130,246,.25), 0 1px 4px rgba(0,0,0,.3); }
  .leaflet-control-zoom a { width: 44px !important; height: 44px !important; line-height: 44px !important; font-size: 24px !important; }
</style>
</head>
<body>

    <p id="status" class="err">위치 사용을 허락해 주셔야 내 위치를 보여 드릴 수 있어요. 휴대폰 설정에서 브라우저의 위치 권한을 켜 주세요.</p>
    <p class="acc" id="acc"></p>

img alt="" src="./안심길 · 지도로 보기_files/52.png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(575px, 434px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/52(1).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(319px, 434px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/52(2).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(831px, 434px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/51(4).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(63px, 178px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/50(4).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(63px, -78px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/52(3).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(63px, 434px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/52(4).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(1087px, 434px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/51(5).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(-193px, 178px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/51(6).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(1343px, 178px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/50(5).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(-193px, -78px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/50(6).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(1343px, -78px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/52(5).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(-193px, 434px, 0px); opacity: 1;"><img alt="" src="./안심길 · 지도로 보기_files/52(6).png" class="leaflet-tile leaflet-tile-loaded" style="width: 256px; height: 256px; transform: translate3d(1343px, 434px, 0px); opacity: 1;"></div><div class="leaflet-tile-container leaflet-zoom-animated" style="z-index: 18; transform: translate3d(0px, 0px, 0px) scale(0.5);"></div></div></div><div class="leaflet-pane leaflet-overlay-pane"></div><div class="leaflet-pane leaflet-shadow-pane"></div><div class="leaflet-pane leaflet-marker-pane"></div><div class="leaflet-pane leaflet-tooltip-pane"></div><div class="leaflet-pane leaflet-popup-pane"></div><div class="leaflet-proxy leaflet-zoom-animated" style="transform: translate3d(28349px, 13141px, 0px) scale(64);"></div></div><div class="leaflet-control-container"><div class="leaflet-top leaflet-left"></div><div class="leaflet-top leaflet-right"></div><div class="leaflet-bottom leaflet-left"></div><div class="leaflet-bottom leaflet-right"><div class="leaflet-control-zoom leaflet-bar leaflet-control"><a class="leaflet-control-zoom-in" href="file:///C:/Users/%ED%97%88%EC%A7%84%EC%84%B1/Downloads/map.html#" title="Zoom in" role="button" aria-label="Zoom in" aria-disabled="false"><span aria-hidden="true">+</span></a><a class="leaflet-control-zoom-out" href="file:///C:/Users/%ED%97%88%EC%A7%84%EC%84%B1/Downloads/map.html#" title="Zoom out" role="button" aria-label="Zoom out" aria-disabled="false"><span aria-hidden="true">−</span></a></div><div class="leaflet-control-attribution leaflet-control"><a href="https://leafletjs.com/" title="A JavaScript library for interactive maps"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8" class="leaflet-attribution-flag"><path fill="#4C7BE1" d="M0 0h12v4H0z"></path><path fill="#FFD500" d="M0 4h12v3H0z"></path><path fill="#E0BC00" d="M0 7h12v1H0z"></path></svg> Leaflet</a> <span aria-hidden="true">|</span> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자</div></div></div></div>
  <div class="bar">
    <button class="btn pri" id="meBtn">내 위치로</button>
    <button class="btn sec" id="followBtn" aria-pressed="true">따라가기 켜짐</button>
  </div>
</div>

<script>
const DEFAULT_CENTER = [35.1796, 129.0756]; // 부산시청 (위치를 못 받을 때 보여 줄 곳)

const $status = document.getElementById('status');
const $acc = document.getElementById('acc');
const $meBtn = document.getElementById('meBtn');
const $followBtn = document.getElementById('followBtn');
let map, meMarker, accCircle, lastPos = null, follow = true, watchId = null;

function setStatus(text, kind) { $status.textContent = text; $status.className = kind || ''; }
function fail(msg) { setStatus(msg, 'err'); $meBtn.disabled = true; $followBtn.disabled = true; }

function showPosition(pos) {
  const { latitude, longitude, accuracy } = pos.coords;
  const ll = [latitude, longitude];
  lastPos = ll;
  if (!meMarker) {
    accCircle = L.circle(ll, { radius: accuracy, color: '#3182f6', weight: 1, opacity: 0.5, fillColor: '#3182f6', fillOpacity: 0.12, interactive: false }).addTo(map);
    meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [24, 24], iconAnchor: [12, 12] }), title: '내 위치', keyboard: false, zIndexOffset: 1000 }).addTo(map);
    map.setView(ll, 17);
  } else {
    meMarker.setLatLng(ll);
    accCircle.setLatLng(ll);
    accCircle.setRadius(accuracy);
    if (follow) map.panTo(ll);
  }
  setStatus('파란 점이 지금 계신 곳이에요.', 'ok');
  $acc.textContent = `위치 오차 약 ${Math.round(accuracy)}m · ${new Date(pos.timestamp).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} 기준`;
}

function showError(err) {
  const msg = {
    1: '위치 사용을 허락해 주셔야 내 위치를 보여 드릴 수 있어요. 휴대폰 설정에서 브라우저의 위치 권한을 켜 주세요.',
    2: '지금은 위치를 찾을 수 없어요. 밖으로 나가시거나 잠시 후 다시 눌러 주세요.',
    3: '위치를 찾는 데 시간이 오래 걸려요. "내 위치로"를 다시 눌러 주세요.',
  }[err.code] || '위치를 찾지 못했어요.';
  setStatus(msg, 'err');
}

function startWatch() {
  if (!('geolocation' in navigator)) { setStatus('이 휴대폰에서는 위치 기능을 쓸 수 없어요.', 'err'); return; }
  if (!window.isSecureContext) { setStatus('위치는 https 주소에서만 쓸 수 있어요. 배포된 주소로 열어 주세요.', 'err'); return; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  setStatus('위치를 찾고 있어요…');
  watchId = navigator.geolocation.watchPosition(showPosition, showError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
}

function updateFollowBtn() {
  $followBtn.textContent = follow ? '따라가기 켜짐' : '따라가기 꺼짐';
  $followBtn.setAttribute('aria-pressed', String(follow));
}
$meBtn.addEventListener('click', () => {
  follow = true; updateFollowBtn();
  if (lastPos) map.setView(lastPos, 17); else startWatch();
});
$followBtn.addEventListener('click', () => { follow = !follow; updateFollowBtn(); if (follow && lastPos) map.panTo(lastPos); });

if (!window.L) {
  fail('지도를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.');
} else {
  map = L.map('map', { zoomControl: false }).setView(DEFAULT_CENTER, 13);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자',
  }).addTo(map);
  // 손가락으로 지도를 움직이면 따라가기를 잠시 끔
  map.on('dragstart', () => { follow = false; updateFollowBtn(); });
  startWatch();
}
</script>
